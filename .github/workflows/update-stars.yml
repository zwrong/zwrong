name: Update Star Counts

on:
  schedule:
    - cron: '0 0 * * *'   # daily at midnight
  workflow_dispatch:       # manual trigger

permissions:
  contents: write

jobs:
  update-stars:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get Vibe-Trading stars
        run: |
          STARS=$(gh api repos/HKUDS/Vibe-Trading --jq '.stargazers_count')
          echo "STARS=$STARS" >> $GITHUB_ENV
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Update Vibe-Trading star count
        run: |
          K=$(echo "scale=1; ${{ env.STARS }} / 1000" | bc)
          sed -E -i "s/(\[\*\*Vibe-Trading\*\*\]\([^)]*\) ⭐ )([0-9.]+K)/\1${K}K/" README.md
          echo "Vibe-Trading: ${{ env.STARS }} → ${K}K"

      - name: Get Paper2Slides stars
        run: |
          STARS=$(gh api repos/HKUDS/Paper2Slides --jq '.stargazers_count')
          echo "P2S_STARS=$STARS" >> $GITHUB_ENV
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Update Paper2Slides star count
        run: |
          K=$(echo "scale=1; ${{ env.P2S_STARS }} / 1000" | bc)
          sed -E -i "s/(\[\*\*Paper2Slides\*\*\]\([^)]*\) ⭐ )([0-9.]+K)/\1${K}K/" README.md
          echo "Paper2Slides: ${{ env.P2S_STARS }} → ${K}K"

      - name: Get Kaku stars
        run: |
          STARS=$(gh api repos/tw93/Kaku --jq '.stargazers_count')
          echo "KAKU_STARS=$STARS" >> $GITHUB_ENV
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Update Kaku star count
        run: |
          K=$(echo "scale=1; ${{ env.KAKU_STARS }} / 1000" | bc)
          sed -E -i "s/(\[\*\*Kaku\*\*\]\([^)]*\) ⭐ )([0-9.]+K)/\1${K}K/" README.md
          echo "Kaku: ${{ env.KAKU_STARS }} → ${K}K"

      - name: Get pi-discuss-mode stars
        run: |
          STARS=$(gh api repos/zwrong/pi-discuss-mode --jq '.stargazers_count')
          echo "PDM_STARS=$STARS" >> $GITHUB_ENV
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Update pi-discuss-mode star count
        run: |
          sed -E -i "s/(\[\*\*pi-discuss-mode\*\*\]\([^)]*\) ⭐ )[0-9]+/\1${{ env.PDM_STARS }}/" README.md
          echo "pi-discuss-mode: ${{ env.PDM_STARS }} stars"

      - name: Get pi-discuss-mode downloads
        run: |
          # Lifetime total. The npm window starts at the first publish date.
          START="2026-07-03"
          END=$(date -u +%F)
          TOTAL=$(curl -fsS "https://api.npmjs.org/downloads/point/${START}:${END}/pi-discuss-mode" | jq -r '.downloads')
          ROUNDED=$(( TOTAL / 100 * 100 ))
          echo "PDM_DOWNLOADS=$ROUNDED" >> $GITHUB_ENV
          echo "pi-discuss-mode: ${TOTAL} downloads since ${START} → ${ROUNDED}+"

      - name: Update pi-discuss-mode download count
        run: |
          sed -E -i "s/\*\*[0-9]+\+ downloads\*\*/**${{ env.PDM_DOWNLOADS }}+ downloads**/" README.md
          echo "pi-discuss-mode: ${{ env.PDM_DOWNLOADS }}+ downloads"

      - name: Commit if changed
        run: |
          if ! git diff --quiet README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: update star and download counts"
            git push
          else
            echo "No changes — counts are already current"
          fi
